# tmux — слой персистентности для агентских сессий.
#
# Зачем вообще: агент (claude/codex) работает десятками минут. Если он живёт
# в окне терминала, падение X убивает его на середине. В сервере tmux он
# переживает и падение X, и закрытие терминала — `tmux attach`, и всё на месте.
# На этой машине это не теория: фризы графики задокументированы в
# ~/GRAPHICS_INCIDENT_2026-07-13.md.
#
# Плагинов здесь нет сознательно: конфиг должен подниматься на голой машине
# (в т.ч. на older laptops) без сети и без tpm.

# --- База ---------------------------------------------------------------

set -g default-terminal "tmux-256color"
# Truecolor для терминалов, которые его умеют (xfce4-terminal, ghostty, kitty)
set -ga terminal-overrides ",*256col*:Tc,xterm-ghostty:Tc"

# Задержка Escape ломает модальный ввод в nvim — обнуляем.
set -sg escape-time 0
# Чтобы nvim видел уход/приход фокуса и делал autoread
set -g focus-events on

# Агенты печатают много. Дефолтные 2000 строк улетают за один прогон.
set -g history-limit 100000

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
# После закрытия окна нумерация не должна зиять дырами
set -g renumber-windows on

# Имя окна задаём мы (например «claude:demo-service»), shell его не перебивает
setw -g allow-rename off
setw -g automatic-rename off

# Заголовок окна терминала. Без этого xfce4-terminal подписывает вкладки
# «Untitled» и вкладку с кодом не отличить от вкладки с git.
set -g set-titles on
set -g set-titles-string "#S · #W"

# --- Префикс ------------------------------------------------------------

# C-b неудобен в вимовой раскладке. C-a привычнее, но занимает
# «в начало строки» в shell — поэтому двойной C-a пробрасывает его внутрь.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Панели и окна ------------------------------------------------------

# | и - вместо непрозрачных " и %. Новая панель наследует текущий каталог.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind c new-window -c "#{pane_current_path}"

# Навигация вимовыми клавишами
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Ресайз с повтором — держать префикс не нужно
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Те же клавиши на русской раскладке — по переменам панелей ходят так же часто,
# как копируют, и переключать раскладку ради одного нажатия незачем. Механика
# та же, что у копи-мода ниже: дубль бинда, потому что langmap в tmux нет.
bind р select-pane -L
bind о select-pane -D
bind л select-pane -U
bind д select-pane -R

bind -r Р resize-pane -L 5
bind -r О resize-pane -D 5
bind -r Л resize-pane -U 5
bind -r Д resize-pane -R 5

# Перечитать конфиг, не убивая сессии
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf перечитан"

# Короткая справка именно по этому конфигу. `read` оставляет popup открытым,
# пока пользователь не нажмёт Enter.
bind ? display-popup -E -w 72 -h 25 'printf "%s\n" \
  "TMUX — шпаргалка (все команды начинаются с Ctrl-a)" \
  "" \
  "?        эта справка             d        отцепиться от сессии" \
  "a        передать Ctrl-a в shell  r        перечитать конфиг" \
  "" \
  "c        новое окно               n / p    следующее / предыдущее окно" \
  "1..9     перейти к окну           &        закрыть окно" \
  "" \
  "| / -    разделить панель         h/j/k/l  перейти между панелями" \
  "H/J/K/L  изменить размер панели   x        закрыть панель" \
  "" \
  "Enter    режим копирования        v / y    выделить / скопировать" \
  "" \
  "Снаружи tmux:  tmux ls — список,  tmux attach — вернуться" \
  "" \
  "Нажмите Enter, чтобы закрыть справку"; read -r _'

# --- Копирование --------------------------------------------------------

setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi Escape send -X cancel

# --- Копи-мод на русской раскладке --------------------------------------
#
# Копировать вывод агента приходится постоянно, и почти всегда — не отрываясь
# от русского текста. Аналога вимового `langmap` в tmux нет: подстановки
# символов он не умеет, поэтому каждая клавиша дублируется явно кириллической
# буквой на той же физической клавише.
#
# Дублируется весь копи-мод, а не только `v`/`y`: с половинчатым набором
# раскладку пришлось бы переключать посреди выделения — то есть ровно в тот
# момент, ради которого всё и делается.
#
# Раскладко-независимы и потому не дублируются: Enter, Escape, Space, цифры,
# стрелки, C-u/C-d, а также `/` и `?` — в ЙЦУКЕН они набираются как есть.
# `$` (конец строки) продублировать нельзя: в русской раскладке его нет
# вообще — Shift-4 даёт `;`. Заменяется движением `Д` (конец экрана).

# выделение и копирование
bind -T copy-mode-vi м send -X begin-selection
bind -T copy-mode-vi М send -X select-line
bind -T copy-mode-vi н send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi й send -X cancel

# курсор
bind -T copy-mode-vi р send -X cursor-left
bind -T copy-mode-vi о send -X cursor-down
bind -T copy-mode-vi л send -X cursor-up
bind -T copy-mode-vi д send -X cursor-right

# по словам
bind -T copy-mode-vi ц send -X next-word
bind -T copy-mode-vi и send -X previous-word
bind -T copy-mode-vi у send -X next-word-end

# по экрану и истории
bind -T copy-mode-vi п send -X history-top
bind -T copy-mode-vi П send -X history-bottom
bind -T copy-mode-vi Р send -X top-line
bind -T copy-mode-vi Д send -X bottom-line
bind -T copy-mode-vi О send -X scroll-down
bind -T copy-mode-vi Л send -X scroll-up

# --- Статус -------------------------------------------------------------

set -g status-position top
set -g status-interval 5
set -g status-style "fg=colour245,bg=colour235"

# Слева — состояние префикса, имя сессии и позиция активного окна.
set -g status-left "#{?client_prefix,#[bg=colour203]#[fg=colour235]#[bold] PREFIX #[default] ,}#[fg=colour235,bg=colour109,bold] #S #[default] окно #I/#{session_windows} "
set -g status-left-length 70

set -g status-right "#[fg=colour245]#h #[fg=colour109]%H:%M "
set -g status-right-length 40

setw -g window-status-current-style "fg=colour223,bg=colour239,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Панель в фокусе видно по рамке
set -g pane-border-style "fg=colour239"
set -g pane-active-border-style "fg=colour109"
