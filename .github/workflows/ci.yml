name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck neovim tmux
          cargo install stylua --version 2.5.2 --locked
          go install github.com/gitleaks/gitleaks/v8@v8.21.2
      - name: Shellcheck
        run: shellcheck bin/* install/*.sh git/mr.sh test/*.sh
      - name: Stylua
        run: stylua --check --config-path nvim/.stylua.toml nvim/init.lua nvim/lua test/*.lua
      - name: Tests
        run: make check
      - name: Secret scan
        run: "$(go env GOPATH)/bin/gitleaks detect --source . --no-git --redact"
